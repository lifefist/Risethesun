<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pharma Rush">
<title>新药风云 · 从靶点到上市 v3.8</title>
<style>
:root{--bg:#0b0f1a;--panel:#131a29;--panel2:#182033;--line:#26314a;--txt:#e8eefc;--dim:#8fa0c0;
--ok:#3ddc97;--warn:#ffcf5c;--bad:#ff6b6b;--brand:#4f8cff;--brand2:#7c5cff;
--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--txt);overscroll-behavior-y:none;
font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
background-image:radial-gradient(900px 460px at 12% -8%,#1b2744 0%,rgba(11,15,26,0) 62%);background-repeat:no-repeat}
#app{padding:calc(10px + var(--st)) 12px calc(100px + var(--sb))}
h1{font-size:17px;margin:2px 0 10px;font-weight:700;letter-spacing:.4px;display:flex;align-items:center}
h1 .co{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h1 .ver{flex:none;font-size:11px;color:var(--dim);font-weight:400;margin:0 8px}
h1 a{flex:none;font-size:12px;color:var(--brand);text-decoration:none;font-weight:400;margin-left:10px;padding:4px 0}
.bar{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.stat span{display:block;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat b{font-size:16px;font-variant-numeric:tabular-nums}
.stat.bad b{color:var(--bad)}.stat.good b{color:var(--ok)}
.kpi{font-size:15px;color:#fff;font-variant-numeric:tabular-nums}
.count{font-size:12px;color:var(--dim);margin:14px 2px 8px;display:flex;justify-content:space-between;gap:8px}
.count.g{color:#7fd8b0;margin-top:6px}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.card.stalled{border-color:#5b4a1f;background:linear-gradient(180deg,#241d10,#1a1509)}
.card.over{border-color:#4f8cff;background:linear-gradient(180deg,#152344,#111a2f)}
.card.ahead{border-color:#2f7a5c}.card.behind{border-color:#7a3a2f}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.code{font-size:16px;font-weight:700}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:999px;background:#22304d;color:#a9c4ff;margin-left:6px;vertical-align:middle;font-weight:400}
.badge{font-size:11px;padding:3px 8px;border-radius:999px;white-space:nowrap}
.badge.ok{background:#123326;color:var(--ok)}.badge.warn{background:#33290f;color:var(--warn)}.badge.rv{background:#3a1f1a;color:#ff9b7a}
.sub{font-size:12px;color:var(--dim);margin-top:5px}
.barline{height:8px;background:#0e1524;border-radius:6px;overflow:hidden;margin:9px 0 6px;border:1px solid #1d2740}
.barline i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2))}
.vs{display:grid;grid-template-columns:46px 1fr 86px;gap:8px;align-items:center;margin-top:6px;font-size:11px;color:var(--dim)}
.vs .vs-bar{height:8px;background:#0e1524;border:1px solid #1d2740;border-radius:6px;overflow:hidden}
.vs .vs-bar i{display:block;height:100%;transition:width .45s ease}
.vs.me .vs-bar i{background:linear-gradient(90deg,#3ddc97,#2f9e6e)}
.vs.rv .vs-bar i{background:linear-gradient(90deg,#ff8a5c,#e0452f)}
.vs .vs-n{text-align:right;font-variant-numeric:tabular-nums}
.tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:9px}
.tiers.three{grid-template-columns:repeat(3,1fr)}
.tiers button{min-height:44px;font-size:13px;border-radius:10px;background:transparent;color:var(--dim)}
.tiers button.on{border-color:var(--brand);background:#16305c;color:#cfe0ff;font-weight:700}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.row button{flex:1;min-width:120px}
button{font:inherit;color:var(--txt);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;touch-action:manipulation;cursor:pointer}
button:active{transform:scale(.99)}
button.primary{background:linear-gradient(180deg,#3f7bff,#2f5be0);border-color:#4f8cff;font-weight:700;color:#fff}
button.ghost{background:transparent;color:var(--dim)}
button:disabled{opacity:.45}
input[type=text]{font:inherit;color:var(--txt);background:#0e1524;border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;margin:6px 0 10px}
input[type=text]::placeholder{color:#5d6c88}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.badge-i{background:#0e1524;border:1px solid #1d2740;border-radius:12px;padding:8px 4px;text-align:center;cursor:pointer}
.badge-i .ic{font-size:20px;display:block;line-height:1.35;filter:grayscale(1);opacity:.32}
.badge-i .nm{font-size:10px;color:var(--dim);display:block;margin-top:2px;line-height:1.25}
.badge-i.on{border-color:#3f7bff;background:#152344}
.badge-i.on .ic{filter:none;opacity:1}
.badge-i.on .nm{color:#cfe0ff}
#log{background:#0d1424;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.6;height:100px;overflow:hidden;color:#bdcbe6}
#log.folded{height:44px}
#log p{margin:0 0 4px}
#log .g{color:var(--ok)}#log .r{color:var(--bad)}#log .y{color:var(--warn)}
#bz{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
footer{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;
padding:8px 12px calc(8px + var(--sb));background:rgba(11,15,26,.93);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
footer .primary{grid-column:1 / -1;min-height:48px;font-size:16px}
footer button{min-height:44px;font-size:14px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(4,7,14,.72);display:flex;align-items:flex-end;justify-content:center}
.modal.hidden{display:none}
.sheet{width:100%;max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line);
border-radius:16px 16px 0 0;padding:14px 14px calc(18px + var(--sb));-webkit-overflow-scrolling:touch}
.sheet h2{font-size:16px;margin:0 0 8px}
.opt{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;background:#111a2b}
.opt.on{border-color:var(--brand);background:#16305c}
#toast{position:fixed;left:50%;bottom:calc(104px + var(--sb));transform:translateX(-50%);z-index:90;max-width:88%;
background:#1b2437;border:1px solid #3a4a6d;color:#e8eefc;padding:10px 14px;border-radius:12px;font-size:14px;
opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
#toast.on{opacity:1;transform:translateX(-50%) translateY(-6px)}
@media(min-width:760px){
#app{max-width:820px;margin:0 auto;padding-bottom:24px}
.bar{grid-template-columns:repeat(4,1fr)}
footer{left:50%;transform:translateX(-50%);width:100%;max-width:820px;grid-template-columns:2fr 1fr 1fr 1fr;border-radius:14px 14px 0 0}
footer .primary{grid-column:auto}
.modal{align-items:center}
.sheet{max-width:560px;border-radius:16px;max-height:82vh}
#log{height:180px;overflow:auto}
}
</style>

<footer id="bar"></footer>
<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>

function rollTo(el,to,fmt,from){
  if(!el)return;
  var has=(typeof el.__cur==='number');
  var start=(from===undefined)?(has?el.__cur:to):from;
  if(!window.requestAnimationFrame||Math.abs(start-to)<1e-9){el.__cur=to;el.textContent=fmt(to);return;}
  if(el.__raf)cancelAnimationFrame(el.__raf);
  var t0=performance.now(),dur=520;
  var step=function(now){
    var k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,3),v=start+(to-start)*e;
    el.__cur=v;el.textContent=fmt(v);
    if(k<1)el.__raf=requestAnimationFrame(step);
    else{el.__raf=null;el.__cur=to;el.textContent=fmt(to);}
  };
  el.__raf=requestAnimationFrame(step);
}
function animSheet(){
  var els=document.querySelectorAll('#sheet [data-n]');
  for(var i=0;i<els.length;i++){
    (function(el){
      var to=parseFloat(el.getAttribute('data-n'))||0,k=el.getAttribute('data-k');
      if(k==='int')rollTo(el,to,function(v){return num(v);},0);
      else if(k==='rank')rollTo(el,to,function(v){return LANG==='zh'?('第 '+Math.round(v)+' 位'):('#'+Math.round(v));},999);
      else rollTo(el,to,function(v){return f2(v);},0);
    })(els[i]);
  }
}

var GAPI='https://countapi.mileshilliard.com/api/v1/',GK='pharma_rush_szb7_';
var G={visits:0,games:0,clicks:0,online:false,tried:false};
var clkBuf=0;
function gFetch(path,ms){
  return new Promise(function(res,rej){
    var ctl=(typeof AbortController!=='undefined')?new AbortController():null;
    var to=setTimeout(function(){if(ctl)ctl.abort();rej(new Error('timeout'));},ms||7000);
    fetch(GAPI+path,{cache:'no-store',signal:ctl?ctl.signal:undefined})
      .then(function(r){clearTimeout(to);if(!r.ok)throw new Error('http '+r.status);return r.json();})
      .then(function(j){res(j&&typeof j.value==='number'?j.value:null);})
      .catch(function(e){clearTimeout(to);rej(e);});
  });
}
function gGet(k){return gFetch('get/'+GK+k);}
function gHit(k){return gFetch('hit/'+GK+k);}
function gAdd(k,d){
  return gGet(k).then(function(cur){return gFetch('set/'+GK+k+'/'+((cur||0)+d));});
}
function refreshGlobal(){
  var a=$('#glob-l1'),b=$('#glob-l2');
  if(!a||!b)return;
  if(!G.online){a.textContent=t('gOff');b.textContent=t('gOff2');return;}
  a.textContent=t('gVisits',num(G.visits|0));
  b.textContent=t('gClicks',num(G.clicks|0),num(G.games|0));
}
function gBoot(){
  if(G.tried)return;
  G.tried=true;refreshGlobal();
  gHit('visits').then(function(v){
    G.online=true;if(v!=null)G.visits=v;refreshGlobal();
    return Promise.all([gGet('clicks'),gGet('games')]);
  }).then(function(arr){
    if(arr&&arr[0]!=null)G.clicks=arr[0];
    if(arr&&arr[1]!=null)G.games=arr[1];
    refreshGlobal();
  }).catch(function(){G.online=false;refreshGlobal();});
}
function flushClicks(){
  if(!G.online||clkBuf<=0)return;
  var d=clkBuf;clkBuf=0;
  gAdd('clicks',d).then(function(v){if(v!=null)G.clicks=v;refreshGlobal();})
    .catch(function(){clkBuf+=d;});
}
function gCountGame(){
  if(!G.online)return;
  gHit('games').then(function(v){if(v!=null)G.games=v;refreshGlobal();}).catch(function(){});
}

/* ================= 对手 ================= */
function newRivalProj(){
  var mine=S.projects.filter(function(p){return p.status!=='launched';}).map(function(p){return p.indId;});
  var ind;
  if(mine.length&&Math.random()<0.45)ind=pick(mine);else ind=pick(INDS).id;
  var m=pick(MODALS),sp=(S.rival?S.rival.speed:1.06)*(0.92+Math.random()*0.20);
  return {code:m.pre+'-'+(1000+rnd(9000)),mod:tx(m.n),ind:ind,stage:0,progress:0,speed:sp};
}
function genRival(st){
  var base={easy:{sp:0.92,lk:0.95},normal:{sp:1.06,lk:1.00},hard:{sp:1.20,lk:1.05}}[(st&&st.diff?st.diff.k:'normal')]||{sp:1.06,lk:1.00};
  var r={name:pick(RPRE[LANG])+' '+pick(RSUF[LANG]),
    speed:base.sp+Math.min(0.14,(STATS.legacy||0)*0.01),luck:base.lk,
    launched:0,launchedInds:[],lastGap:null,proj:null};
  var saveS=S;S=st||S;
  r.proj=newRivalProj();
  S=saveS;
  return r;
}
function rivalStage(){return (S.rival&&S.rival.proj)?S.rival.proj.stage:8;}
function myStage(){
  var s=-1;
  S.projects.forEach(function(p){s=Math.max(s,p.stage);});
  if(S.marketed.length)s=Math.max(s,8);
  return s;
}
function rivalStep(L){
  var r=S.rival;
  if(!r||!r.proj)return;
  var p=r.proj,st=STAGES[p.stage];
  p.progress+=p.speed*(0.82+Math.random()*0.42);
  if(p.progress<(st.need||1))return;
  p.progress=0;
  var rate=clamp(STBASE[p.stage]*indOf(p.ind).coef*r.luck,0.05,0.96);
  if(Math.random()<=rate){
    p.stage++;
    if(p.stage>=8){
      var iid=p.ind;
      r.launched++;r.launchedInds.push(iid);
      L.push(t('lg_rLaunch',r.name,p.code,tx(indOf(iid).n),r.launched));
      S.marketed.forEach(function(m){
        if(m.indId===iid&&m.comp<4){m.comp++;m.share=clamp(m.share*0.92,0.25,1.10);
          L.push(t('lg_rHit',p.code,m.name));}
      });
      r.proj=newRivalProj();
    }else if(p.stage>=4&&p.stage<=6){
      L.push(t('lg_rUp',r.name,p.code,stName(p.stage)));
    }
  }else if(st.cl&&Math.random()<0.5){
    L.push(t('lg_rDie',r.name,p.code,stName(p.stage)));
    r.proj=newRivalProj();
  }else{
    L.push(t('lg_rMiss',r.name,p.code,stName(p.stage)));
  }
}
function gapCheck(L){
  var r=S.rival;
  if(!r)return;
  if(S.marketed.length>0||r.launched>0)return;
  var ms=myStage(),rs=rivalStage();
  if(ms<0)return;
  var gap=ms-rs;
  if(r.lastGap!=null){
    if(r.lastGap<0&&gap>=0)L.push(t('lg_overtake',r.name,stName(ms)));
    else if(r.lastGap>=0&&gap<0)L.push(t('lg_lead',r.name,-gap,stName(rs)));
  }
  r.lastGap=gap;
}

/* ================= 排行榜 ================= */
function loadRanks(){
  try{
    var a=JSON.parse(localStorage.getItem(RKEY)||'[]');
    if(!Array.isArray(a))return [];
    return a.map(function(x){
      return {net:Number(x&&x.net)||0,tier:(x&&x.tier)||'-',pos:(x&&x.pos!=null)?Number(x.pos):null,
        diff:(x&&x.diff)||{zh:'—',en:'—'},co:(x&&x.co)||'',rvWin:(x&&x.rvWin)?1:0,
        launched:Number(x&&x.launched)||0,firstQ:Number(x&&x.firstQ)||0,
        clicks:Number(x&&x.clicks)||0,sec:Number(x&&x.sec)||0,ts:Number(x&&x.ts)||0};
    }).sort(function(a,b){return b.net-a.net;}).slice(0,20);
  }catch(e){return [];}
}
function saveRank(res){
  var list=loadRanks();
  var ts=list.slice().sort(function(a,b){return a.ts-b.ts;});
  var last=ts[ts.length-1]||null;
  var best=list[0]||null;
  res.isRecord=!best||res.net>best.net+0.005;
  var fasts=list.filter(function(x){return x.firstQ>0;});
  var fastQ=fasts.length?Math.min.apply(null,fasts.map(function(x){return x.firstQ;})):0;
  var streak=1,cur=res.net;
  for(var i=ts.length-1;i>=0;i--){
    if(cur>ts[i].net){streak++;cur=ts[i].net;}else break;
  }
  res.cmp={hasPrev:!!last,prevNet:last?last.net:0,prevPos:last?last.pos:null,prevTier:last?last.tier:'-',
    prevFirstQ:last?last.firstQ:0,streak:streak,fastQ:fastQ};
  var row={net:res.net,tier:res.tier,pos:res.pos,diff:{zh:tx(S.diff.n),en:tx(S.diff.n)},co:S.co,
    rvWin:res.rvWin,launched:S.launched,firstQ:S.firstQ,clicks:S.clicks,sec:res.sec,ts:Date.now()};
  list.push(row);
  list.sort(function(a,b){return b.net-a.net;});
  try{localStorage.setItem(RKEY,JSON.stringify(list.slice(0,20)));}catch(e){}
}

function setTier(pid,k){
  var p=S.projects.filter(function(x){return x.id===pid;})[0];
  if(!p)return;
  p.tier=k;save();render();
}
function killProj(pid){
  var p=S.projects.filter(function(x){return x.id===pid;})[0];
  if(!p)return;
  S.projects=S.projects.filter(function(x){return x.id!==pid;});
  S.kills++;S.fails++;
  logIt(t('lg_kill',p.name),'r');
  save();render();
}
function retryProj(pid){
  var p=S.projects.filter(function(x){return x.id===pid;})[0];
  if(!p||p.stalled<=0||p.retryUsed)return;
  if(S.cash<RETRY_COST){toast(t('noRetry',money(RETRY_COST)));return;}
  S.cash-=RETRY_COST;p.retryUsed=true;
  var rate=clamp(passRate(p)*0.85,0.03,0.95);
  var roll=Math.random()*100;
  if(roll<=rate*100){
    p.stalled=0;p.stage++;
    if(p.stage>=8){doLaunch(p,[]);}
    else{logIt(t('lg_retryOK',p.name,(rate*100).toFixed(1),roll.toFixed(1)),'g');p.stalled=0;}
    S.rescued=true;unlock('rescue');
  }else{
    logIt(t('lg_retryDie',p.name),'r');
    S.projects=S.projects.filter(function(x){return x!==p;});
    S.kills++;S.fails++;
  }
  save();render();
}

/* ================= 推进季度 ================= */
function nextQuarter(){
  if(!S||S.over)return;
  var L=[];
  var mods={pass:0,cost:1,speed:1,rev:1};
  if(Math.random()<S.diff.evt)doEvent(L,mods);
  if(TEAM_PAY[S.team]>0){
    S.cash-=TEAM_PAY[S.team];
    L.push(t('lg_salary',S.team,money(TEAM_PAY[S.team])));
  }
  S.projects.slice().forEach(function(p){
    if(p.stalled>0){
      p.stalled--;
      if(p.stalled<=0){
        S.projects=S.projects.filter(function(x){return x!==p;});
        S.kills++;S.fails++;
        L.push(t('lg_stallDie',p.name));
      }else L.push(t('lg_stallLeft',p.name,p.stalled));
      return;
    }
    var tr=tierOf(p.tier);
    if(p.tier==='pause'){L.push(t('lg_pause',p.name,tx(INDS.filter(function(x){return x.id===p.indId;})[0].n)));return;}
    var st=STAGES[p.stage],ind=indOf(p.indId);
    var cost=st.cost*ind.cost*p.costK*tr.c*mods.cost;
    if(S.cash<cost){L.push(t('lg_noCash',p.name));return;}
    S.cash-=cost;p.spent+=cost;
    p.progress+=tr.s*teamSpeed()*mods.speed;
    L.push(t('lg_spend',p.name,stName(p.stage),money(cost),(Math.min(100,p.progress/st.need*100)).toFixed(0)));
    if(p.progress>=st.need){
      p.progress=0;
      var rate=passRate(p)+tr.p+mods.pass;
      rate=clamp(rate,0.03,0.95);
      var roll=Math.random()*100;
      if(roll<=rate*100){
        p.stage++;S.okStreak=(S.okStreak||0)+1;
        if(S.okStreak>=5)unlock('streak5');
        if(S.okStreak>1&&S.okStreak%5===0)L.push(t('lg_hot',S.okStreak));
        if(p.stage>=8)doLaunch(p,L);
        else L.push(t('lg_advance',p.name,stName(p.stage)),'g');
      }else{
        p.rollFails++;S.okStreak=0;
        L.push(t('lg_fail',p.name,stName(p.stage),(rate*100).toFixed(1)),'r');
        if(st.cl){
          p.stalled=4;
          L.push(t('lg_stallOn',p.name,money(RETRY_COST)),'y');
        }else{
          p.progress=0;
          L.push(t('lg_dead',p.name),'r');
        }
      }
    }
  });
  marketQuarter(L,mods);
  rivalStep(L);
  gapCheck(L);
  S.q++;
  S.last=Date.now();
  if(S.q>MAX_Q){save();settle();return;}
  save();
  render();
  L.slice(-4).forEach(function(m){logIt(m);});
  if(S.cash<0&&S.cash>-1)logIt(t('lg_salary',S.team,money(0)));
}
function doLaunch(p,L){
  var ind=indOf(p.indId);
  var meToo=S.rival.launchedInds.indexOf(p.indId)>=0;
  var peak=ind.peak*(0.85+Math.random()*0.30);
  if(meToo)peak*=0.82;else peak*=1.08;
  S.marketed.push({id:p.id,name:p.name,indId:p.indId,peak:peak,age:0,share:1,comp:0,sales:'mid'});
  S.projects=S.projects.filter(function(x){return x!==p;});
  S.launched++;
  if(!S.firstQ)S.firstQ=S.q;
  if(p.rollFails===0)S.perfect=true;
  if(meToo)L.push(t('lg_meToo',tx(ind.n),S.rival.name),'y');
  else{S.firstIn++;L.push(t('lg_firstIn',S.rival.name,tx(ind.n)),'g');}
  L.push(t('lg_launch',p.name,tx(ind.n),money(peak)),'g');
  unlock('launch1');
  if(S.firstQ<=12)unlock('fast12');
  if(S.launched>=3)unlock('launch3');
  if(!meToo)unlock('first_in');
  if(S.perfect)unlock('perfect');
}
function marketQuarter(L,mods){
  if(!S.marketed.length)return;
  var g=0,s=0;
  S.marketed.forEach(function(m){
    m.age++;
    var sl=salesOf(m.sales);
    m.share=clamp(m.share+sl.def-SHARE_DECAY,0.25,1.10);
    if(m.age%3===0&&m.comp<4){
      m.comp++;
      if(m.comp===3){m.share=clamp(m.share*0.78,0.25,1.10);L.push(t('lg_c3',m.name),'r');}
      if(m.comp===4){m.share=clamp(m.share*0.85,0.25,1.10);L.push(t('lg_c4',m.name),'r');}
    }
    var ramp=Math.min(1,0.35+m.age*0.16);
    var cliff=m.age>20?0.4:1;
    var gross=m.peak/4*ramp*m.share*cliff*mods.rev;
    var sga=gross*sl.rate;
    S.cash+=gross-sga;
    m.lastGross=gross;m.lastNet=gross-sga;m.lastSga=sga;
    g+=gross;s+=sga;
  });
  if(g>0)L.push(t('lg_sales',money(g-s),money(g),money(s)),'g');
}

/* ================= 事件 ================= */
function doEvent(L,mods){
  var evts=[
   function(){mods.pass+=0.06;L.push(t('ev_evt',t('ev_pass')));},
   function(){mods.cost*=1.3;L.push(t('lg_evt',t('ev_costUp')));},
   function(){mods.cost*=0.8;L.push(t('lg_evt',t('ev_costDn')));},
   function(){mods.speed*=1.25;L.push(t('lg_evt',t('ev_speed')));},
   function(){var a=0.4+Math.random()*0.8;S.cash+=a;L.push(t('lg_evt',t('ev_bd',money(a))),'g');},
   function(){var a=0.3+Math.random()*0.6;S.cash-=a;L.push(t('lg_evt',t('ev_gmp',money(a))),'r');},
   function(){var a=0.2+Math.random()*0.5;S.cash-=a;L.push(t('lg_evt',t('ev_lab',money(a))),'r');},
   function(){var ps=S.projects.filter(function(p){return p.stalled<=0;});
     if(!ps.length)return;var p=pick(ps);p.progress=Math.max(0,p.progress-0.5);
     L.push(t('lg_evt',t('ev_leave',t('st'+p.stage))),'r');},
   function(){mods.rev*=1.25;L.push(t('lg_evt',t('ev_reimb')),'g');},
   function(){mods.rev*=0.7;L.push(t('lg_evt',t('ev_vbp')),'r');},
   function(){if(!S.marketed.length)return;var m=pick(S.marketed);m.peak*=0.85;
     L.push(t('lg_evt',t('ev_peak',m.name)),'r');},
   function(){if(!S.marketed.length)return;var m=pick(S.marketed);m.comp=Math.min(4,m.comp+1);
     L.push(t('lg_evt',t('ev_alert',m.name)),'r');}
  ];
  pick(evts)();
}
/* 注意：第一个事件用了 ev_evt（不存在时回退为键名），这里改为直接用 lg_evt */
function passRate(p){
  var ind=indOf(p.indId);
  return clamp(STBASE[p.stage]*ind.coef*(0.82+0.14*p.ade)
   +S.diff.pass+teamPass()+S.exp*0.01+perkLv('pass')*0.02,0.03,0.95);
}
function expBonusPct(){return Math.round(S.exp*3);}

/* ================= 结算 ================= */
function settle(){
  S.over=true;
  var cash=S.cash,mktVal=0,pipeVal=0;
  S.marketed.forEach(function(m){mktVal+=m.peak*m.share*1.2;});
  var base=[0.35,0.5,0.7,0.6,1.1,1.8,3.0,1.2,0];
  S.projects.forEach(function(p){
    var st=STAGES[p.stage];
    var ratio=st.need>0?clamp(p.progress/st.need,0,1):0.5;
    pipeVal+=(base[p.stage]||0.4)*(0.5+0.5*ratio)*(p.stalled>0?0.5:1);
  });
  var eq=S.equity;
  var net=(cash+mktVal+pipeVal)*(1-eq);
  var g=gradeOf(net),pos=rankPos(net);
  var sec=(Date.now()-S.t0)/1000;
  STATS.games++;saveStats();
  gCountGame();
  var rvWin=0;
  if(S.rival)rvWin=S.launched>S.rival.launched?1:(S.launched===S.rival.launched?0:-1);
  S.result={net:net,cash:cash,mktVal:mktVal,pipeVal:pipeVal,eq:eq,tier:g.tier,rank:g.rank,
    pos:pos,clicks:S.clicks,sec:sec,firstQ:S.firstQ,launched:S.launched,kills:S.kills,
    team:S.team,exp:S.exp,rvWin:rvWin,isRecord:false,cmp:null};
  saveRank(S.result);
  scanBadges();
  var pts={'S':8,'A':5,'B':3,'C':2,'D':1,'E':1}[g.tier]||1;
  S.result.pts=pts;
  STATS.legacy=(STATS.legacy||0)+pts;saveStats();
  save();render();
  openSheet(resultSheet);
}
function vsBlock(){
  var r=S.rival,res=S.result;
  if(!r)return '';
  var you=S.launched,rv=r.launched;
  var head;
  if(you===0&&rv===0)head=t('vsNone');
  else if(you>rv)head=t('vsWin',you,rv);
  else if(you===rv)head=t('vsTie',you);
  else head=t('vsLose',rv,you);
  var taken=r.launchedInds.map(function(id){return tx(indOf(id).n);});
  return '<div class="opt"><div style="font-weight:700">'+t('vsT',tx(S.diff.n))+'</div>'
   +'<div class="sub" style="color:#e8eefc;font-size:13px">'+head+'</div>'
   +'<div class="sub">'+t('vsLine',S.firstIn||0,(taken.length?t('vsTaken',taken.join('、')):t('vsNoTaken')))+'</div>'
   +'<div class="sub">'+t('vsStr',tx(S.diff.n),Math.min(14,(STATS.legacy||0)))+'</div></div>';
}
function selfBlock(){
  var res=S.result,c=res.cmp;
  if(!c||!c.hasPrev)return '<div class="opt"><div style="font-weight:700">'+t('selfT')+'</div>'
    +'<div class="sub">'+t('firstRun')+'</div></div>';
  var lines=[];
  var d=res.net-c.prevNet;
  if(Math.abs(d)<0.05)lines.push(t('pgSame',t('prevWho')));
  else if(d>0)lines.push(t('pgUp',t('prevWho'),money(d),''));
  else lines.push(t('pgDown',t('prevWho'),money(-d)));
  if(res.pos!=null&&c.prevPos!=null){
    var pd=c.prevPos-res.pos;
    if(pd>0)lines.push(t('prUp',pd,c.prevPos,res.pos));
    else if(pd<0)lines.push(t('prDown',-pd,c.prevPos,res.pos));
    else lines.push(t('prSame',res.pos));
  }
  if(c.prevTier!==res.tier){
    var i0=ORDER.indexOf(c.prevTier),i1=ORDER.indexOf(res.tier);
    if(i1>i0)lines.push(t('ptUp',c.prevTier,res.tier));
  }
  if(res.firstQ>0&&c.prevFirstQ>0){
    var fd=c.prevFirstQ-res.firstQ;
    if(fd>0)lines.push(t('pfFast',res.firstQ,t('prevRun'),fd));
    else if(fd<0)lines.push(t('pfSlow',res.firstQ,t('prevRun'),-fd));
    else lines.push(t('pfSame',t('prevRun'),res.firstQ));
  }else if(res.firstQ>0&&c.prevFirstQ===0){
    lines.push(t('pfNew',t('prevRun'),res.firstQ));
  }
  if(res.isRecord)lines.push(t('pRec',c.fastQ?money(c.fastQ):'—'));
  if(c.streak>=3)lines.push(t('pStreak',c.streak));
  if(!lines.length)lines.push(t('pNone'));
  return '<div class="opt"><div style="font-weight:700">'+t('selfT')+'</div>'
   +lines.map(function(x){return '<div class="sub" style="color:#cfe0ff;font-size:13px">'+x+'</div>';}).join('')
   +'</div>';
}

   +'<div class="vs rv"><span>'+t('rivalS')+'</span><span class="vs-bar"><i style="width:'+(rs/8*100).toFixed(0)+'%"></i></span>'
   +'<span class="vs-n">'+stName(clamp(rs,0,8))+'</span></div>'
   +'<div class="sub">'+cmp+' · '+t('launchedN',r.launched)
   +t('lastMove','',S.firstIn||0,(taken.length?t('takenN',taken.length):''))+'</div></div>';
}
function renderMarket(){
  var el=$('#market');
  if(!S.marketed.length){el.innerHTML='';return;}
  el.innerHTML='<div class="card"><div class="top"><div class="code">'+t('mktT')+'</div></div>'
   +S.marketed.map(function(m){
      var ind=indOf(m.indId);
      var sl=salesOf(m.sales);
      return '<div style="border-top:1px solid #1f2a42;margin-top:9px;padding-top:9px">'
       +'<div class="top"><div><span class="code" style="font-size:14px">'+esc(m.name)+'</span>'
       +'<span class="tag">'+tx(ind.n)+'</span></div>'
       +'<div class="badge '+(m.comp>=3?'rv':'ok')+'">'+t('threat',m.comp,'/4')+'</div></div>'
       +'<div class="sub">'+t('peak',money(m.peak),m.age,(m.share*100).toFixed(0))
       +(S.rival.launchedInds.indexOf(m.indId)>=0?t('hasRival'):'')+(m.age>20?t('cliff'):'')+'</div>'
       +(m.lastGross?('<div class="sub">'+t('grossQ',money(m.lastGross),money(m.lastSga),((m.lastSga/m.lastGross)*100).toFixed(0))+'</div>'):'')
       +'<div class="sub">'+t('trend',((sl.def-SHARE_DECAY)*100).toFixed(1),(m.sales==='high'?t('defend'):t('fade')))+'</div>'
       +'<div class="tiers three">'+SALES.map(function(x){
          return '<button class="'+(m.sales===x.k?'on':'')+'" onclick="setSales(\''+m.id+'\',\''+x.k+'\')">'+t(x.n)+'</button>';
        }).join('')+'</div></div>';
    }).join('')+'</div>';
}
function setSales(id,k){
  var m=S.marketed.filter(function(x){return x.id===id;})[0];
  if(!m)return;
  m.sales=k;save();render();
}
function footerHTML(){
  var el=$('#bar');
  if(!S){
    el.innerHTML='<button class="primary" onclick="startSheet(true)">'+t('go')+'</button>';
    return;
  }
  if(S.over){
    el.innerHTML='<button class="primary" onclick="newRunSheet()">'+t('overBtn')+'</button>';
    return;
  }
  el.innerHTML='<button class="primary" onclick="nextQuarter()">'+t('next')+'</button>'
   +'<button onclick="openProject()">'+t('proj')+'</button>'
   +'<button onclick="openSheet(financeSheet)">'+t('raise')+'</button>'
   +'<button onclick="openSheet(hireSheet)">'+t('hire')+'</button>';
}

/* ================= 点击统计 ================= */
document.addEventListener('click',function(){
  if(!S||S.over)return;
  S.clicks++;STATS.clicks++;clkBuf++;
  renderStats();
  if(STATS.clicks===1000)unlock('click1k');
},true);

/* ================= 启动 ================= */
(function boot(){
  loadStats();
  applyI18n();
  gBoot();
  setInterval(flushClicks,45000);
  document.addEventListener('visibilitychange',function(){if(document.hidden){flushClicks();save();}});
  window.addEventListener('pagehide',function(){flushClicks();save();});
  S=load();
  if(S){
    render();
    setTimeout(function(){welcomeSheet();offlineCheck();},350);
  }else{
    render();
    openSheet(startHTML);
  }
})();
<script>
/* ===== 修复：界面时间显示成 "yq" ===== */
(function(){
  var LKEY = 'pharma_lang', SKEY = 'pharma_v3_save';
  function label(){
    var q = 0;
    try{
      var s = JSON.parse(localStorage.getItem(SKEY) || 'null');
      if (s) q = Number(s.q || s.quarter || 0) || 0;
    }catch(e){}
    if (!q) return null;
    var y = Math.floor((q - 1) / 4) + 1, qi = (q - 1) % 4 + 1;
    var en = false;
    try{ en = localStorage.getItem(LKEY) === 'en'; }catch(e){}
    return en ? ('Y' + y + ' Q' + qi) : ('第 ' + y + ' 年 Q' + qi);
  }
  function fix(){
    var t = label();
    if (!t) return;
    var w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false), n;
    while ((n = w.nextNode())){
      var v = n.nodeValue;
      if (v && /(^|[^A-Za-z])yq([^A-Za-z]|$)/i.test(v)) n.nodeValue = v.replace(/yq/gi, t);
    }
  }
  function start(){
    fix();
    try{
      new MutationObserver(function(){ fix(); })
        .observe(document.body, {childList:true, subtree:true, characterData:true});
    }catch(e){}
    setInterval(fix, 1500);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
</script>
